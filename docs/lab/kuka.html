<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KUKA KR Digital Twin Sandbox</title>

<style>

:root{
    --bg:#17171c;
    --card:#101014;
    --orange:#ff5a00;
    --cyan:#00bcd4;
    --green:#00ff66;
    --red:#ff3333;
    --text:#ffffff;
}


body{

    margin:0;
    padding:20px;

    background:var(--bg);
    color:white;

    font-family:
    Segoe UI,
    Arial,
    sans-serif;

}


h1{
    color:white;
}


.panel{

    background:#202027;

    padding:15px;

    border-radius:8px;

    margin-bottom:15px;

}


button,
select{

    padding:10px;

    background:var(--orange);

    border:none;

    color:white;

    font-weight:bold;

    border-radius:5px;

}


#robotViewport{

    width:800px;

    height:550px;

    border:
    2px solid #333;

    background:#050507;

    overflow:hidden;

}

#robotViewport canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
}


.layout{

    display:flex;

    gap:20px;

}


.console{

    width:350px;

}


.terminal{

    background:black;

    color:#00ff66;

    height:150px;

    overflow:auto;

    padding:10px;

    font-family:monospace;

}


.stats{

    background:#111;

    padding:15px;

    margin-top:10px;

}

</style>

</head>


<body>


<h1>
🤖 KUKA KR Digital Twin Logic Sandbox
</h1>


<p>
3D industrial robot simulation with PLC state-machine control,
fault injection and manufacturing workflow visualization.
</p>



<div class="panel">

<button onclick="toggleMode()">
Logic:
<span id="mode">
BUGGY
</span>
</button>


<select onchange="pickMode=this.value">

<option value="1">
Single Pick
</option>

<option value="2">
Duo Pick
</option>

<option value="3">
Stack Pick
</option>

</select>


</div>



<div class="layout">


<div>


<div id="robotViewport"></div>


<div class="stats">

State:
<span id="state">
CASE 0
</span>

<br>

Boxes:
<span id="boxes">
0
</span>


<br>

Robot:
<span id="robotStatus">
READY
</span>


</div>


</div>




<div class="console">


<h3>
PLC Diagnostics
</h3>


<div class="terminal" id="terminal">

SYSTEM BOOT...

</div>


</div>


</div>





<script src="
https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js">
</script>


<script src="
https://cdn.jsdelivr.net/npm/three@0.160/examples/js/controls/OrbitControls.js">
</script>



<script>


let buggy=true;

let pickMode=3;


let stepper=0;

let boxes=0;

let carrying=false;



function log(msg){

let t=document.getElementById("terminal");

t.innerHTML +=
"<br>"+msg;

t.scrollTop=t.scrollHeight;

}




function toggleMode(){

buggy=!buggy;

document.getElementById("mode").innerHTML =
buggy ? "BUGGY" : "FIXED";


log(
"MODE -> "+
(buggy?"BUGGY":"SAFE")
);

}




/* ======================
 THREE.JS WORLD
====================== */


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x080808);



const camera =
new THREE.PerspectiveCamera(
45,
800/550,
0.1,
100
);


camera.position.set(
6,
5,
8
);



const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
800,
550
);



document
.getElementById("robotViewport")
.appendChild(
renderer.domElement
);



const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);



controls.enableDamping=true;



/*
Lighting
*/


scene.add(
new THREE.AmbientLight(
0xffffff,
0.7
)
);


let light =
new THREE.DirectionalLight(
0xffffff,
2
);


light.position.set(
5,
8,
5
);


scene.add(light);



/*
Floor
*/


let floor =
new THREE.Mesh(

new THREE.BoxGeometry(
10,
0.1,
10
),

new THREE.MeshStandardMaterial(
{
color:0x222222
}

)

);


floor.position.y=-0.05;

scene.add(floor);





/*
Conveyor
*/


let conveyor =
new THREE.Mesh(

new THREE.BoxGeometry(
5,
0.3,
1
),

new THREE.MeshStandardMaterial(
{
color:0x444444
}

)

);


conveyor.position.set(
0,
0.2,
-2
);


scene.add(conveyor);



/*
Box
*/


let box =
new THREE.Mesh(

new THREE.BoxGeometry(
0.5,
0.5,
0.5
),

new THREE.MeshStandardMaterial(
{
color:0xff8800
}

)

);


box.position.set(
2,
0.5,
-2
);


scene.add(box);






/*
KUKA Robot Skeleton

base
 |
A1
 |
A2
 |
A3
 |
A4
 |
A5
 |
A6

*/


let robot =
new THREE.Group();


scene.add(robot);



function joint(
name,
size,
color
){

let mesh =
new THREE.Mesh(

new THREE.CylinderGeometry(
size,
size,
0.25,
32
),

new THREE.MeshStandardMaterial(
{
color:color
}

)

);


mesh.name=name;

return mesh;

}



let base =
joint(
"BASE",
0.5,
0xffaa00
);


robot.add(base);



let arm1 =
joint(
"A1",
0.25,
0xffcc00
);


arm1.position.y=1;

base.add(arm1);



let arm2 =
joint(
"A2",
0.22,
0xffcc00
);


arm2.position.y=1;

arm1.add(arm2);



let arm3 =
joint(
"A3",
0.18,
0xffcc00
);


arm3.position.y=1;

arm2.add(arm3);



let wrist =
joint(
"A6",
0.12,
0xffffff
);


wrist.position.y=0.8;

arm3.add(wrist);





robot.position.set(
0,
0,
0
);






function animateRobot(){

let t =
Date.now()*0.001;



base.rotation.y =
Math.sin(t)*0.5;


arm1.rotation.z =
Math.sin(t)*0.3;


arm2.rotation.z =
Math.cos(t)*0.5;


arm3.rotation.z =
Math.sin(t)*0.8;


wrist.rotation.y =
Math.cos(t)*1;


}





/*
PLC STATE MACHINE
*/


function plc(){


switch(stepper){


case 0:

log(
"CASE 0 Safety Reset"
);

stepper=100;

break;



case 100:

log(
"CASE 100 Move Pick"
);

stepper=200;

break;



case 200:

log(
"CASE 200 Grip SKU"
);

carrying=true;

stepper=300;

break;



case 300:

log(
"CASE 300 Transfer"
);

if(!buggy){

box.position.x=0;

}

stepper=400;

break;



case 400:

log(
"CASE 400 Release"
);

carrying=false;

boxes++;

document.getElementById("boxes")
.innerHTML=boxes;


stepper=100;


break;



}


document.getElementById("state")
.innerHTML=
"CASE "+stepper;


}




setInterval(
plc,
3000
);





function loop(){


animateRobot();


controls.update();


renderer.render(
scene,
camera
);


requestAnimationFrame(loop);


}



loop();



</script>


</body>
</html>
