<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ULR Procedure Trainer — A/THR + AP LOC/GS + FMA</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#070b16; }
    #wrap { position:relative; width:100%; height:100%; }
    canvas { display:block; }
    #hud { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }

    #help {
      position:absolute; left:12px; top:12px;
      color:#d7deff; font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background:rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.08);
      padding:10px 12px; border-radius:12px;
      max-width:780px;
    }
    #help b { color:#ffffff; }
    #help .dim { opacity:0.85; }

    #panel {
      position:absolute; left:12px; bottom:12px;
      width:min(520px, 44vw);
      color:#e7ecff;
      font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background:rgba(0,0,0,0.40);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px;
      padding:12px 12px;
    }
    #panel .title { font-weight:700; font-size:13px; margin-bottom:6px; }
    #panel .row { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0; opacity:0.95; }
    #panel .chip {
      padding:4px 8px; border-radius:999px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.08);
    }
    #panel .good { color:#bff7cf; }
    #panel .warn { color:#ffd39a; }
    #panel .bad  { color:#ff9aa8; }
    #panel .dim { opacity:0.80; }
    #panel .hr { height:1px; background:rgba(255,255,255,0.10); margin:10px 0; }
    #panel kbd{
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.15);
      border-bottom-color:rgba(255,255,255,0.25);
      padding:1px 6px; border-radius:6px;
      font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
      #ctrl{
    position:absolute;
    right:12px;
    bottom:12px;
    width:min(640px, 52vw);
    color:#e7ecff;
    font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background:rgba(0,0,0,0.40);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:12px;
    pointer-events:auto;
    backdrop-filter: blur(6px);
  }

  .ctrl-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .ctrl-row.dim{ opacity:0.85; }

  .ctrl-grid{
    display:grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap:10px;
  }

  .box{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:10px;
  }

  .btn{
    cursor:pointer;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:#e7ecff;
    padding:6px 10px;
    border-radius:10px;
  }

  .btn.on{
    background: rgba(145,255,170,0.14);
    border-color: rgba(145,255,170,0.55);
    color:#bff7cf;
  }

  input[type="range"]{ width:100%; accent-color:#8fb0ff; }  
  </style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <div class="title" id="phaseTitle">PHASE</div>
    <div class="row" id="chips"></div>
    <div class="hr"></div>
    <div id="stepText"></div>
    <div class="hr"></div>
    <div class="dim" id="notes"></div>
  </div>

  <div id="ctrl">
  <div class="ctrl-row">
    <button class="btn" data-toggle="athr">A/THR</button>
    <button class="btn" data-toggle="ap">AP1</button>
    <button class="btn" data-toggle="loc">LOC</button>
    <button class="btn" data-toggle="gs">G/S</button>
    <button class="btn" data-toggle="gear">GEAR</button>
    <button class="btn" data-toggle="pause">PAUSE</button>
    <button class="btn ghost" data-action="reset1">RESET APP</button>
    <button class="btn ghost" data-action="reset2">RESET RWY</button>
  </div>

  <div class="ctrl-grid">
    <div class="box">
      <div class="lbl">THR</div>
      <input id="thr" type="range" min="0" max="100" value="55" />
      <div class="readout"><span id="thrV">55</span>%</div>
      <div class="hint">A/THR ON will override slowly</div>
    </div>

    <div class="box">
      <div class="lbl">SPD TARGET</div>
      <input id="spd" type="range" min="0" max="340" step="5" value="155" />
      <div class="readout"><span id="spdV">155</span> kt</div>
      <div class="hint">Used by A/THR and AP pitch bias</div>
    </div>

    <div class="box">
      <div class="lbl">FLAPS</div>
      <div class="stepper">
        <button class="btn sm" data-action="flapsDown">-</button>
        <div class="readout"><span id="flapsV">0</span></div>
        <button class="btn sm" data-action="flapsUp">+</button>
      </div>
      <div class="hint">0..4 (toy configs)</div>
    </div>

    <div class="box">
      <div class="lbl">BRAKES</div>
      <input id="brk" type="range" min="0" max="100" value="0" />
      <div class="readout"><span id="brkV">0</span>%</div>
      <div class="hint">Optional: hold B still works</div>
    </div>
  </div>

  <div class="ctrl-row dim">
    <div>Mouse/touch: drag on screen to command <b>Pitch/Roll</b> (AP OFF). Double-click to center.</div>
  </div>
</div>

  <canvas id="hud"></canvas>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

/* ===========================
   UNITS + HELPERS
=========================== */
const FT_PER_M = 3.280839895;
const M_PER_FT = 1 / FT_PER_M;
const KTS_PER_MPS = 1.943844492;
const MPS_PER_KTS = 1 / KTS_PER_MPS;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const sign = x => x < 0 ? -1 : 1;

function isaRho(alt_m){
  const rho0 = 1.225, H = 8500.0;
  return rho0 * Math.exp(-alt_m / H);
}
function wrapAngle(a){
  while (a > Math.PI) a -= 2*Math.PI;
  while (a < -Math.PI) a += 2*Math.PI;
  return a;
}
function band(val, target, tol){ return Math.abs(val - target) <= tol; }

/* ===========================
   RUNWAY / ILS GEOMETRY (toy)
=========================== */
const RWY = {
  heading: 0,                 // rad along +x
  threshold: new THREE.Vector3(0, 0, 0),
  length: 3600,
  width: 60,
  gsDeg: 3.0,
  locScaleMPerDot: 25,
  gsScaleMPerDot: 15,
  decisionAltAglFt: 200,
};

function ilsDeviation(pos){
  const dx = RWY.threshold.x - pos.x;
  const dist = Math.max(dx, 1);
  const desiredAlt = Math.tan(rad(RWY.gsDeg)) * dist;
  const gsErrM = pos.y - desiredAlt;

  const locDots = clamp(pos.z / RWY.locScaleMPerDot, -2.5, 2.5);
  const gsDots  = clamp(gsErrM / RWY.gsScaleMPerDot, -2.5, 2.5);
  return { locDots, gsDots, distM: dist, gsErrM };
}

/* ===========================
   SIM STATE (toy physics + trainer + AP)
=========================== */
const sim = {
  paused: false,

  pos: new THREE.Vector3(-12000, 25000 * M_PER_FT, 0),
  vel: new THREE.Vector3(155 * MPS_PER_KTS, 0, 0),

  pitch: rad(2),
  roll: 0,
  yaw: 0,

  // direct pilot controls (when AP off)
  throttle: 0.55,
  flaps: 0,         // 0..4
  gearDown: true,
  brakes: 0,

  // aircraft params (toy)
  mass: 175000,
  wingArea: 443,
  maxThrust: 2 * 320000,
  g: 9.80665,

  pitchRate: rad(28),
  rollRate:  rad(45),
  yawRate:   rad(18),

  onGround: false,

  // outputs
  iasKts: 0,
  altFt: 0,
  vsFpm: 0,

  // scoring
  score: 100,
  faults: 0,
  gate1000Checked: false,
  gate500Checked: false,
  lastCallout: "",
  calloutTimer: 0,

  // A/THR + AP
  spdTarget: 180,          // kt
  athrOn: false,
  apOn: false,
  apLocArmed: false,
  apGsArmed: false,

  // mode annunciations
  fma: {
    col1: "MAN THR",  // A/THR column
    col2: "---",      // lateral (LOC)
    col3: "---",      // vertical (G/S)
    ap:   ""          // AP1
  },

  // capture state
  locCaptured: false,
  gsCaptured: false,
};

function vrefToy(){
  if (sim.flaps >= 3 && sim.gearDown) return 140;
  if (sim.flaps === 2) return 155;
  if (sim.flaps === 1) return 175;
  return 190;
}

function callout(text, penalty=0){
  if (text === sim.lastCallout) return;
  sim.lastCallout = text;
  sim.calloutTimer = 2.8;
  if (penalty > 0){
    sim.score = clamp(sim.score - penalty, 0, 100);
    sim.faults += 1;
  }
}

function resetApproach(){
  sim.pos.set(-12000, 25000 * M_PER_FT, 0);
  sim.vel.set(155 * MPS_PER_KTS, 0, 0);
  sim.pitch = rad(2);
  sim.roll = 0;
  sim.yaw = 0;

  sim.throttle = 0.55;
  sim.flaps = 0;
  sim.gearDown = true;
  sim.brakes = 0;

  sim.onGround = false;

  sim.score = 100;
  sim.faults = 0;
  sim.gate1000Checked = false;
  sim.gate500Checked = false;
  sim.lastCallout = "";
  sim.calloutTimer = 0;

  // AP/A/THR default off
  sim.athrOn = false;
  sim.apOn = false;
  sim.apLocArmed = false;
  sim.apGsArmed = false;
  sim.locCaptured = false;
  sim.gsCaptured = false;
  sim.spdTarget = 180;

  trainer.reset();
}

function resetRunway(){
  sim.pos.set(120, 0.5, 0);
  sim.vel.set(0, 0, 0);
  sim.pitch = 0;
  sim.roll = 0;
  sim.yaw = 0;

  sim.throttle = 0.0;
  sim.flaps = 1;
  sim.gearDown = true;
  sim.brakes = 1;

  sim.onGround = true;

  sim.score = 100;
  sim.faults = 0;
  sim.gate1000Checked = false;
  sim.gate500Checked = false;
  sim.lastCallout = "";
  sim.calloutTimer = 0;

  sim.athrOn = false;
  sim.apOn = false;
  sim.apLocArmed = false;
  sim.apGsArmed = false;
  sim.locCaptured = false;
  sim.gsCaptured = false;
  sim.spdTarget = 0;

  trainer.resetTakeoff();
}

/* ===========================
   INPUTS
=========================== */
const keys = new Set();
addEventListener("keydown", (e) => {
  keys.add(e.code);

  if (e.code === "KeyP") sim.paused = !sim.paused;
  if (e.code === "Digit1") resetApproach();
  if (e.code === "Digit2") resetRunway();

  if (e.code === "KeyG") sim.gearDown = !sim.gearDown;
  if (e.code === "KeyZ") sim.flaps = clamp(sim.flaps + 1, 0, 4);
  if (e.code === "KeyX") sim.flaps = clamp(sim.flaps - 1, 0, 4);

  if (e.code === "Space") trainer.ack();

  // toggles
  if (e.code === "KeyT") sim.athrOn = !sim.athrOn;
  if (e.code === "KeyM") sim.apOn = !sim.apOn;
  if (e.code === "KeyL") sim.apLocArmed = !sim.apLocArmed;
  if (e.code === "KeyK") sim.apGsArmed = !sim.apGsArmed;

  if (e.code === "BracketLeft") sim.spdTarget = clamp(sim.spdTarget - 5, 0, 340);
  if (e.code === "BracketRight") sim.spdTarget = clamp(sim.spdTarget + 5, 0, 340);
});
addEventListener("keyup", (e) => keys.delete(e.code));

/* ===========================
   TRAINER STATE MACHINE (kept concise)
=========================== */
const trainer = (() => {
  const state = {
    phase: "CRZ",
    step: 0,
    awaitingAck: true,
    msg: "",
    note: "",
    targets: { spd: 155, alt: 25000, config: "Clean" }
  };

  function set(phase, step, msg, note, targets){
    state.phase = phase; state.step = step;
    state.msg = msg; state.note = note;
    if (targets) state.targets = targets;
  }

  function reset(){
    set("CRZ", 0,
      "CRZ: stabilize (≈25000 ft, ≈155 kt). Press SPACE to begin DES.",
      "Tip: try A/THR (T) to hold speed; AP is optional.",
      { spd:155, alt:25000, config:"Clean" }
    );
    state.awaitingAck = true;
    // set a reasonable SPD target
    sim.spdTarget = 155;
  }

  function resetTakeoff(){
    set("T/O", 0,
      "T/O: FLAPS 1. Brakes held. Advance thrust, then release. Press SPACE.",
      "Rotate >150 kt with pitch >5°. (Toy.)",
      { spd:0, alt:0, config:"FLAPS 1, GEAR DOWN" }
    );
    state.awaitingAck = true;
  }

  function ack(){
    if (!state.awaitingAck) return;
    state.awaitingAck = false;

    if (state.phase==="CRZ"){
      set("DES", 1,
        "DES: descend to 6000 ft. Target ~250 kt. Press SPACE near 6000 ft.",
        "Keep ILS deviations reasonable (≤±2 dots).",
        { spd:250, alt:6000, config:"FLAPS 0-1" }
      );
      sim.spdTarget = 250;
      return;
    }
    if (state.phase==="DES"){
      set("APP", 2,
        "APP: set up intercept. Target ~3000 ft and ~180 kt. FLAPS 2. Press SPACE when LOC controlled.",
        "You may arm AP LOC (L) and AP G/S (K) once stable.",
        { spd:180, alt:3000, config:"FLAPS 2 (gear soon)" }
      );
      sim.spdTarget = 180;
      return;
    }
    if (state.phase==="APP"){
      set("FINAL", 3,
        "FINAL: configure (FLAPS 3/4 + GEAR DOWN). Target VREF+5. Press SPACE when stabilized.",
        "Stabilized gates at 1000' and 500'. If unstable: reset with 1.",
        { spd:(vrefToy()+5), alt:0, config:"FLAPS 3/4, GEAR DOWN" }
      );
      sim.spdTarget = vrefToy()+5;
      return;
    }
    if (state.phase==="FINAL"){
      set("LAND", 4,
        "LAND: flare at ~30-20 ft, reduce thrust gently. Touchdown on centerline.",
        "After touchdown: brake and stop.",
        { spd:vrefToy(), alt:0, config:"Configured" }
      );
      sim.spdTarget = vrefToy();
      return;
    }
  }

  function tick(dt){
    const alt = sim.altFt, ias = sim.iasKts, vs = sim.vsFpm;
    const agl = Math.max(alt, 0);
    const ils = ilsDeviation(sim.pos);

    // stabilized approach checks (toy)
    const vTgt = vrefToy();
    const spdOkFinal = (ias >= vTgt - 10) && (ias <= vTgt + 10);
    const sinkOk = Math.abs(vs) <= 1000;
    const locOk = Math.abs(ils.locDots) <= 1.0;
    const gsOk  = Math.abs(ils.gsDots) <= 1.0;
    const cfgOkFinal = (sim.flaps >= 3) && sim.gearDown;

    // gates
    if (!sim.onGround && !sim.gate1000Checked && agl <= 1000){
      sim.gate1000Checked = true;
      if (spdOkFinal && sinkOk && locOk && gsOk && cfgOkFinal) callout("1000' STABLE ✅", 0);
      else callout("1000' UNSTABLE ❌", 12);
    }
    if (!sim.onGround && !sim.gate500Checked && agl <= 500){
      sim.gate500Checked = true;
      if (spdOkFinal && sinkOk && locOk && gsOk && cfgOkFinal) callout("500' STABLE ✅", 0);
      else callout("500' UNSTABLE ❌", 18);
    }

    // touchdown transitions to roll
    if (sim.onGround && state.phase !== "ROLL" && state.phase !== "T/O"){
      set("ROLL", 5,
        "ROLL: maintain centerline. Hold B to brake. Stop to finish.",
        "Score penalizes runway excursion.",
        { spd:0, alt:0, config:"Rollout" }
      );
    }

    // dynamic guidance notes
    if (state.phase === "FINAL"){
      state.targets.spd = vrefToy() + 5;
    }
    if (state.phase === "LAND"){
      state.targets.spd = vrefToy();
    }

    // completion prompts (gated by ack)
    if (!state.awaitingAck){
      if (state.phase==="DES"){
        if (alt < 6800 && ias <= 270) { state.awaitingAck = true; state.msg += "  (Press SPACE)"; }
      }
      if (state.phase==="APP"){
        if (band(alt, 3000, 600) && sim.flaps>=2 && Math.abs(ils.locDots)<=1.5) { state.awaitingAck = true; state.msg += "  (Press SPACE)"; }
      }
      if (state.phase==="FINAL"){
        const okCfg = (sim.flaps>=3 && sim.gearDown);
        const okNeedles = Math.abs(ils.locDots)<=1.2 && Math.abs(ils.gsDots)<=1.2;
        const okSpd = Math.abs(sim.iasKts - (vrefToy()+5))<=15;
        if (okCfg && okNeedles && okSpd && alt < 1200) { state.awaitingAck = true; state.msg += "  (Press SPACE)"; }
      }
    }

    // soft scoring near ground if deviating a lot
    if (!sim.onGround && agl < 3000){
      if (Math.abs(ils.locDots) > 2.0) sim.score = clamp(sim.score - dt * 1.6, 0, 100);
      if (Math.abs(ils.gsDots)  > 2.0) sim.score = clamp(sim.score - dt * 1.6, 0, 100);
    }
  }

  return { state, reset, resetTakeoff, ack, tick };
})();
trainer.reset();

/* ===========================
   AUTOTHROTTLE (A/THR) — toy speed hold
   - simple PI controller on speed error
=========================== */
const athr = {
  integ: 0,
  update(dt){
    if (!sim.athrOn) { athr.integ = 0; return; }
    // Only in air or on takeoff roll; ignore when stopped with brakes.
    if (sim.onGround && sim.iasKts < 5 && sim.brakes > 0.5) return;

    const err = (sim.spdTarget - sim.iasKts); // + if slow => increase thrust
    athr.integ = clamp(athr.integ + err * dt * 0.08, -0.8, 0.8);

    // P + I mapped to throttle delta
    const cmd = err * 0.012 + athr.integ; // toy tuning
    // push throttle toward commanded "throttle demand"
    sim.throttle = clamp(sim.throttle + cmd * dt, 0, 1);
  }
};

/* ===========================
   AUTOPILOT (AP1) — toy ILS capture/track
   - AP master controls whether it can move pitch/roll
   - LOC and G/S are independently armed
   - capture logic: LOC* then LOC; G/S* then G/S
=========================== */
const ap = {
  // internal smoothing
  rollCmdDeg: 0,
  pitchCmdDeg: 0,

  update(dt){
    const ils = ilsDeviation(sim.pos);
    const agl = Math.max(sim.altFt, 0);

    // Reset capture if toggles off
    if (!sim.apOn){
      sim.locCaptured = false;
      sim.gsCaptured = false;
      return;
    }

    // Capture conditions (toy)
    const locArm = sim.apLocArmed;
    const gsArm  = sim.apGsArmed;

    // LOC capture: if within ~1.8 dots, capture
    if (locArm && !sim.locCaptured && Math.abs(ils.locDots) <= 1.8) sim.locCaptured = true;
    // GS capture: require within ~1.8 dots AND below ~6000 ft (avoid capturing too high)
    if (gsArm && !sim.gsCaptured && Math.abs(ils.gsDots) <= 1.8 && agl < 6000) sim.gsCaptured = true;

    // Mode annunciations
    // col2 lateral
    if (!sim.apOn) sim.fma.col2 = "---";
    else if (locArm && !sim.locCaptured) sim.fma.col2 = "LOC*";
    else if (sim.locCaptured) sim.fma.col2 = "LOC";
    else sim.fma.col2 = "---";

    // col3 vertical
    if (!sim.apOn) sim.fma.col3 = "---";
    else if (gsArm && !sim.gsCaptured) sim.fma.col3 = "G/S*";
    else if (sim.gsCaptured) sim.fma.col3 = "G/S";
    else sim.fma.col3 = "---";

    sim.fma.ap = sim.apOn ? "AP1" : "";

    // Guidance laws (toy)
    // roll command drives locDots -> 0
    const rollCmd = (sim.locCaptured || locArm) ? clamp(-ils.locDots * 10, -25, 25) : 0;

    // pitch command drives gsDots -> 0 (only if GS captured/armed), otherwise gentle VS control by target alt
    let pitchCmd = 0;
    if (sim.gsCaptured || gsArm){
      // If above GS => pitch down (negative cmd), if below => pitch up (positive cmd)
      pitchCmd = clamp(-ils.gsDots * 4, -10, 10);
      // small speed coupling: if too slow, reduce pitch down command / add pitch up bias
      const spdErr = (sim.spdTarget - sim.iasKts);
      pitchCmd += clamp(spdErr * 0.05, -2.5, 2.5);
    } else {
      // crude "alt hold toward target" outside GS
      const tgtAlt = trainer.state.targets.alt || sim.altFt;
      const altErr = tgtAlt - sim.altFt; // + if need climb
      pitchCmd = clamp(altErr * 0.002, -6, 6);
    }

    // Smooth commands
    ap.rollCmdDeg = ap.rollCmdDeg + (rollCmd - ap.rollCmdDeg) * clamp(dt * 2.5, 0, 1);
    ap.pitchCmdDeg = ap.pitchCmdDeg + (pitchCmd - ap.pitchCmdDeg) * clamp(dt * 2.0, 0, 1);

    // Apply to aircraft attitude (rate-limited)
    // Convert cmd to attitude error relative to current
    // roll toward cmd directly; pitch toward cmd (deg) directly
    const rollErr = rad(ap.rollCmdDeg) - sim.roll;
    const pitchErr = rad(ap.pitchCmdDeg) - sim.pitch;

    // Use sim roll/pitch rates as actuators
    sim.roll  += clamp(rollErr,  -sim.rollRate*dt,  sim.rollRate*dt);
    sim.pitch += clamp(pitchErr, -sim.pitchRate*dt, sim.pitchRate*dt);

    sim.roll = clamp(sim.roll, rad(-45), rad(45));
    sim.pitch = clamp(sim.pitch, rad(-12), rad(18));
  }
};

/* ===========================
   FMA (mode annunciations)
=========================== */
function updateFMA(){
  sim.fma.col1 = sim.athrOn ? "SPEED" : "MAN THR";
  // Lateral/vertical set by ap.update()
  sim.fma.ap = sim.apOn ? "AP1" : "";
}

/* ===========================
   PHYSICS STEP (same toy model)
=========================== */
function stepPhysics(dt){
  // pilot inputs only when AP is not taking over pitch/roll
  const pitchIn = (keys.has("KeyW") ? 1 : 0) - (keys.has("KeyS") ? 1 : 0);
  const rollIn  = (keys.has("KeyD") ? 1 : 0) - (keys.has("KeyA") ? 1 : 0);
  const yawIn   = (keys.has("KeyE") ? 1 : 0) - (keys.has("KeyQ") ? 1 : 0);
  const thrIn   = (keys.has("KeyR") ? 1 : 0) - (keys.has("KeyF") ? 1 : 0);

  sim.brakes = keys.has("KeyB") ? 1 : 0;

  // manual throttle changes still possible; A/THR will bias it afterwards
  sim.throttle = clamp(sim.throttle + thrIn * dt * 0.35, 0, 1);

  // If AP off, apply manual attitude inputs
  if (!sim.apOn){
    sim.pitch += pitchIn * sim.pitchRate * dt;
    sim.roll  += rollIn  * sim.rollRate  * dt;
  }
  // yaw always manual in this toy
  sim.yaw   += yawIn * sim.yawRate * dt;

  sim.pitch = clamp(sim.pitch, rad(-15), rad(20));
  sim.roll  = clamp(sim.roll,  rad(-45), rad(45));
  sim.yaw   = wrapAngle(sim.yaw);

  // Atmosphere
  const alt_m = Math.max(sim.pos.y, 0);
  const rho = isaRho(alt_m);
  const v = sim.vel.length();
  const v_safe = Math.max(v, 1e-3);

  // Directions from yaw
  const fwd = new THREE.Vector3(Math.cos(sim.yaw), 0, -Math.sin(sim.yaw)).normalize();
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), fwd).normalize();

  // AoA estimate
  const gamma = Math.asin(clamp(sim.vel.y / v_safe, -0.99, 0.99));
  const alpha = sim.pitch - gamma;

  const flapsBoost = [0.0, 0.25, 0.55, 0.85, 1.10][sim.flaps];
  const gearDrag = sim.gearDown ? 0.020 : 0.0;

  const CL = clamp(0.25 + 4.8 * alpha + flapsBoost, -0.5, 2.4);
  const CD = clamp(0.030 + 0.09 * CL*CL + flapsBoost*0.04 + gearDrag, 0.02, 0.40);

  const q = 0.5 * rho * v*v;
  const L = q * sim.wingArea * CL;
  const D = q * sim.wingArea * CD;

  const thrustAltFactor = clamp(1.0 - alt_m / 15000.0, 0.65, 1.0);
  const T = sim.maxThrust * sim.throttle * thrustAltFactor;
  const W = sim.mass * sim.g;

  // Forces
  const bank = sim.roll;
  const liftUp = L * Math.cos(bank);

  const horizVel = new THREE.Vector3(sim.vel.x, 0, sim.vel.z);
  const hv = horizVel.length();
  const horizDir = hv > 1e-3 ? horizVel.clone().normalize() : fwd.clone();

  let ax = 0, ay = 0, az = 0;

  const thrustVec = fwd.clone().multiplyScalar(T / sim.mass);
  const dragVec = horizDir.clone().multiplyScalar(-D / sim.mass);

  ax += thrustVec.x + dragVec.x;
  az += thrustVec.z + dragVec.z;

  ay += (liftUp - W) / sim.mass;

  const sideForce = (L * Math.sin(bank)) / sim.mass;
  ax += right.x * sideForce;
  az += right.z * sideForce;

  // Ground contact
  if (sim.pos.y <= 0.01){
    if (sim.vel.y < -1.5) sim.vel.y *= -0.25;
    else {
      sim.onGround = true;
      sim.pos.y = 0.01;
      sim.vel.y = 0;
    }
  } else sim.onGround = false;

  if (sim.onGround){
    const rotateReady = (L > 0.9 * W) && (sim.pitch > rad(5)) && (sim.gearDown);
    if (rotateReady){
      sim.onGround = false;
      sim.vel.y = Math.max(sim.vel.y, 2.0);
    }

    const mu = 0.02 + 0.30 * sim.brakes;
    const friction = mu * sim.g;
    if (hv > 0.01){
      const fricVec = horizDir.clone().multiplyScalar(-friction);
      ax += fricVec.x;
      az += fricVec.z;
    }
    ay = 0;
  }

  // Integrate
  sim.vel.x += ax * dt;
  sim.vel.y += ay * dt;
  sim.vel.z += az * dt;

  sim.vel.multiplyScalar(1.0 - 0.0025);
  sim.pos.addScaledVector(sim.vel, dt);

  // runway excursion penalty
  if (sim.onGround && sim.pos.x >= 0 && sim.pos.x <= RWY.length){
    if (Math.abs(sim.pos.z) > RWY.width * 0.55) sim.score = clamp(sim.score - dt * 8.0, 0, 100);
  }

  // outputs
  sim.iasKts = sim.vel.length() * KTS_PER_MPS;
  sim.altFt = sim.pos.y * FT_PER_M;
  sim.vsFpm = (sim.vel.y * FT_PER_M) * 60.0;
}

/* ===========================
   HUD (PFD-ish + ILS + FD + FMA)
=========================== */
const hud = document.getElementById("hud");
const hctx = hud.getContext("2d");
hud.width = wrap.clientWidth * devicePixelRatio;
hud.height = wrap.clientHeight * devicePixelRatio;

function drawText(x,y,txt, color="rgba(215,222,255,0.95)", size=12){
  hctx.save();
  hctx.fillStyle = color;
  hctx.font = `${size * devicePixelRatio}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
  hctx.fillText(txt, x, y);
  hctx.restore();
}

function drawHorizon(cx, cy, pitchDeg, rollDeg){
  const W = hud.width, H = hud.height;
  hctx.save();
  hctx.translate(cx, cy);
  hctx.rotate(-rad(rollDeg));

  const pxPerDeg = 6 * devicePixelRatio;
  hctx.translate(0, pitchDeg * pxPerDeg);

  hctx.fillStyle = "rgba(90,130,255,0.18)";
  hctx.fillRect(-W, -H, W*2, H);
  hctx.fillStyle = "rgba(110,80,40,0.16)";
  hctx.fillRect(-W, 0, W*2, H);

  hctx.strokeStyle = "rgba(255,255,255,0.55)";
  hctx.lineWidth = 2 * devicePixelRatio;
  hctx.beginPath();
  hctx.moveTo(-220*devicePixelRatio, 0);
  hctx.lineTo( 220*devicePixelRatio, 0);
  hctx.stroke();

  hctx.strokeStyle = "rgba(255,255,255,0.35)";
  hctx.lineWidth = 1 * devicePixelRatio;
  for (let p=-30; p<=30; p+=5){
    if (p === 0) continue;
    const y = -p * pxPerDeg;
    const len = (p % 10 === 0) ? 120 : 70;
    hctx.beginPath();
    hctx.moveTo(-len*devicePixelRatio, y);
    hctx.lineTo( len*devicePixelRatio, y);
    hctx.stroke();
  }
  hctx.restore();

  // fixed aircraft symbol
  hctx.save();
  hctx.translate(cx, cy);
  hctx.strokeStyle = "rgba(255,255,255,0.85)";
  hctx.lineWidth = 2 * devicePixelRatio;
  hctx.beginPath();
  hctx.moveTo(-40*devicePixelRatio, 0);
  hctx.lineTo(-10*devicePixelRatio, 0);
  hctx.moveTo( 40*devicePixelRatio, 0);
  hctx.lineTo( 10*devicePixelRatio, 0);
  hctx.moveTo(-10*devicePixelRatio, 0);
  hctx.lineTo(0, 8*devicePixelRatio);
  hctx.lineTo(10*devicePixelRatio, 0);
  hctx.stroke();
  hctx.restore();
}

function drawIlsNeedles(cx, cy, locDots, gsDots){
  const dotPx = 18 * devicePixelRatio;
  hctx.save();
  hctx.translate(cx, cy);
  hctx.strokeStyle = "rgba(145,255,170,0.9)";
  hctx.lineWidth = 2 * devicePixelRatio;

  const locX = clamp(locDots, -2.5, 2.5) * dotPx;
  hctx.beginPath();
  hctx.moveTo(locX, -90*devicePixelRatio);
  hctx.lineTo(locX,  90*devicePixelRatio);
  hctx.stroke();

  const gsY = clamp(gsDots, -2.5, 2.5) * dotPx;
  hctx.beginPath();
  hctx.moveTo(-120*devicePixelRatio, gsY);
  hctx.lineTo( 120*devicePixelRatio, gsY);
  hctx.stroke();

  hctx.fillStyle = "rgba(145,255,170,0.55)";
  for (let i=-2; i<=2; i++){
    if (i===0) continue;
    hctx.beginPath(); hctx.arc(i*dotPx, 0, 2.2*devicePixelRatio, 0, Math.PI*2); hctx.fill();
    hctx.beginPath(); hctx.arc(0, i*dotPx, 2.2*devicePixelRatio, 0, Math.PI*2); hctx.fill();
  }
  hctx.restore();
}

function drawFD(cx, cy, rollCmdDeg, pitchCmdDeg){
  hctx.save();
  hctx.translate(cx, cy);

  const pxPerDeg = 6 * devicePixelRatio;
  const rollPx = clamp(rollCmdDeg, -20, 20) * pxPerDeg;
  const pitchPx = clamp(pitchCmdDeg, -15, 15) * pxPerDeg;

  hctx.strokeStyle = "rgba(255,95,220,0.95)";
  hctx.lineWidth = 3 * devicePixelRatio;

  hctx.beginPath();
  hctx.moveTo(rollPx, -18*devicePixelRatio);
  hctx.lineTo(rollPx,  18*devicePixelRatio);
  hctx.stroke();

  hctx.beginPath();
  hctx.moveTo(-30*devicePixelRatio, -pitchPx);
  hctx.lineTo( 30*devicePixelRatio, -pitchPx);
  hctx.stroke();

  hctx.restore();
}

function drawFMA(){
  // three columns + AP1 at right
  const W = hud.width;
  const x = W*0.22;
  const y = 26*devicePixelRatio;
  const w = W*0.56;
  const h = 26*devicePixelRatio;

  hctx.save();
  hctx.fillStyle = "rgba(0,0,0,0.40)";
  hctx.strokeStyle = "rgba(255,255,255,0.10)";
  hctx.lineWidth = 1*devicePixelRatio;
  hctx.beginPath();
  hctx.roundRect(x, y, w, h, 8*devicePixelRatio);
  hctx.fill();
  hctx.stroke();

  const colW = w/3;
  const col1 = sim.fma.col1;
  const col2 = sim.fma.col2;
  const col3 = sim.fma.col3;

  const green = "rgba(145,255,170,0.95)";
  const white = "rgba(230,236,255,0.95)";
  const mag = "rgba(255,95,220,0.95)";

  const colColor = (s) => {
    if (s.includes("*")) return mag;      // capture
    if (s==="SPEED" || s==="LOC" || s==="G/S") return green;
    return white;
  };

  drawText(x+12*devicePixelRatio, y+18*devicePixelRatio, col1, colColor(col1), 13);
  drawText(x+colW+12*devicePixelRatio, y+18*devicePixelRatio, col2, colColor(col2), 13);
  drawText(x+2*colW+12*devicePixelRatio, y+18*devicePixelRatio, col3, colColor(col3), 13);

  if (sim.fma.ap){
    drawText(x+w+12*devicePixelRatio, y+18*devicePixelRatio, sim.fma.ap, green, 13);
  }
  hctx.restore();
}

function drawHUD(){
  const W = hud.width, H = hud.height;
  hctx.clearRect(0,0,W,H);

  const cx = W * 0.52;
  const cy = H * 0.52;

  drawFMA();

  drawHorizon(cx, cy, deg(sim.pitch), deg(sim.roll));
  const ils = ilsDeviation(sim.pos);
  drawIlsNeedles(cx, cy, ils.locDots, ils.gsDots);

  // FD cues: if AP on, show commanded cues; else show "suggestion" cues
  const fdRollCmd = sim.apOn ? ap.rollCmdDeg : clamp(-ils.locDots * 8, -25, 25);
  const gsBias = clamp(-ils.gsDots * 4, -10, 10);
  const spdErr = clamp((sim.spdTarget - sim.iasKts) * 0.05, -3, 3);
  const fdPitchCmd = sim.apOn ? ap.pitchCmdDeg : clamp(gsBias + spdErr, -12, 12);

  drawFD(cx, cy, fdRollCmd, fdPitchCmd);

  // Left block
  const left = 18*devicePixelRatio;
  let y = 90*devicePixelRatio;
  const line = (t)=>{ drawText(left, y, t); y += 18*devicePixelRatio; };

  line(`IAS   ${sim.iasKts.toFixed(0)} kt`);
  line(`ALT   ${sim.altFt.toFixed(0)} ft`);
  line(`VS    ${sim.vsFpm.toFixed(0)} fpm`);
  line(`THR   ${(sim.throttle*100).toFixed(0)}%`);
  line(`SPD*  ${sim.spdTarget.toFixed(0)} kt`);
  line(`FLAPS ${sim.flaps}`);
  line(`GEAR  ${sim.gearDown ? "DOWN" : "UP"}`);
  line(`A/THR ${sim.athrOn ? "ON" : "OFF"}`);
  line(`AP1   ${sim.apOn ? "ON" : "OFF"}`);
  line(`LOC   ${sim.apLocArmed ? "ARM" : "OFF"} ${sim.locCaptured ? "(CAP)" : ""}`);
  line(`G/S   ${sim.apGsArmed ? "ARM" : "OFF"} ${sim.gsCaptured ? "(CAP)" : ""}`);
  line(`SCORE ${sim.score.toFixed(0)}`);

  // Right info
  drawText(W - 260*devicePixelRatio, 90*devicePixelRatio, `LOC ${ils.locDots.toFixed(2)} dots`, "rgba(145,255,170,0.95)");
  drawText(W - 260*devicePixelRatio, 110*devicePixelRatio, `GS  ${ils.gsDots.toFixed(2)} dots`, "rgba(145,255,170,0.95)");
  drawText(W - 260*devicePixelRatio, 130*devicePixelRatio, `VREF~ ${vrefToy().toFixed(0)} kt`, "rgba(145,255,170,0.95)");

  // Callout
  if (sim.calloutTimer > 0){
    drawText(W*0.46, H*0.88, sim.lastCallout, "rgba(255,210,120,0.95)", 14);
  }
}

=========================== */
const phaseTitle = document.getElementById("phaseTitle");
const chipsEl = document.getElementById("chips");
const stepText = document.getElementById("stepText");
const notes = document.getElementById("notes");

function chip(text, cls=""){
  const div = document.createElement("div");
  div.className = `chip ${cls}`.trim();
  div.textContent = text;
  return div;
}

function updatePanel(){
  const st = trainer.state;
  phaseTitle.textContent = `${st.phase} — Step ${st.step}`;

  chipsEl.innerHTML = "";
  const ils = ilsDeviation(sim.pos);
  const agl = Math.max(sim.altFt, 0);

  chipsEl.appendChild(chip(`SPD tgt ${sim.spdTarget.toFixed(0)} kt`));
  chipsEl.appendChild(chip(`ALT tgt ${st.targets.alt || "GS"}`));
  chipsEl.appendChild(chip(`CFG ${st.targets.config || "-"}`));
  chipsEl.appendChild(chip(`LOC ${ils.locDots.toFixed(2)}`));
  chipsEl.appendChild(chip(`GS ${ils.gsDots.toFixed(2)}`));
  chipsEl.appendChild(chip(`AGL ${agl.toFixed(0)} ft`));

  const vTgt = sim.spdTarget;
  const spdOk = Math.abs(sim.iasKts - vTgt) <= 15;
  const needlesOk = Math.abs(ils.locDots) <= 1.5 && Math.abs(ils.gsDots) <= 1.5;
  const cfgOk = (st.phase === "FINAL" || st.phase === "LAND")
    ? (sim.flaps >= 3 && sim.gearDown)
    : true;

  chipsEl.appendChild(chip(spdOk ? "SPD OK" : "SPD OFF", spdOk ? "good" : "warn"));
  chipsEl.appendChild(chip(needlesOk ? "ILS OK" : "ILS OFF", needlesOk ? "good" : "warn"));
  chipsEl.appendChild(chip(cfgOk ? "CFG OK" : "CFG OFF", cfgOk ? "good" : "bad"));

  stepText.innerHTML = st.msg + (st.awaitingAck ? `<div style="margin-top:8px"><kbd>SPACE</kbd> ACK / Continue</div>` : "");
  notes.textContent = st.note || "";
}

const toggleButtons = {
  athr: ctrlEl.querySelector('[data-toggle="athr"]'),
  ap:   ctrlEl.querySelector('[data-toggle="ap"]'),
  loc:  ctrlEl.querySelector('[data-toggle="loc"]'),
  gs:   ctrlEl.querySelector('[data-toggle="gs"]'),
  gear: ctrlEl.querySelector('[data-toggle="gear"]'),
  pause:ctrlEl.querySelector('[data-toggle="pause"]'),
};

function syncUIFromSim(){
  // sliders -> reflect sim
  thrEl.value = Math.round(sim.throttle * 100);
  spdEl.value = Math.round(sim.spdTarget / 5) * 5;
  brkEl.value = Math.round(sim.brakes * 100);

  thrV.textContent = thrEl.value;
  spdV.textContent = spdEl.value;
  brkV.textContent = brkEl.value;
  flapsV.textContent = sim.flaps;

  // button states
  const setOn = (btn, on) => btn.classList.toggle("on", !!on);

  setOn(toggleButtons.athr, sim.athrOn);
  setOn(toggleButtons.ap, sim.apOn);
  setOn(toggleButtons.loc, sim.apLocArmed);
  setOn(toggleButtons.gs, sim.apGsArmed);
  setOn(toggleButtons.gear, sim.gearDown);
  setOn(toggleButtons.pause, sim.paused);

  // warn if arming LOC/GS with AP off (trainer-like)
  toggleButtons.loc.classList.toggle("warn", sim.apLocArmed && !sim.apOn);
  toggleButtons.gs.classList.toggle("warn",  sim.apGsArmed && !sim.apOn);
}

ctrlEl.addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle], [data-action]");
  if (!t) return;

  const tog = t.getAttribute("data-toggle");
  const act = t.getAttribute("data-action");

  if (tog){
    if (tog === "athr") sim.athrOn = !sim.athrOn;
    if (tog === "ap")   sim.apOn = !sim.apOn;
    if (tog === "loc")  sim.apLocArmed = !sim.apLocArmed;
    if (tog === "gs")   sim.apGsArmed = !sim.apGsArmed;
    if (tog === "gear") sim.gearDown = !sim.gearDown;
    if (tog === "pause") sim.paused = !sim.paused;
  }

  if (act){
    if (act === "reset1") resetApproach();
    if (act === "reset2") resetRunway();
    if (act === "flapsUp") sim.flaps = clamp(sim.flaps + 1, 0, 4);
    if (act === "flapsDown") sim.flaps = clamp(sim.flaps - 1, 0, 4);
  }

  syncUIFromSim();
});

/* ===========================
   MOUSE / TOUCH: drag to command pitch/roll (AP OFF)
   - simple "virtual yoke" that feeds into attitude directly
=========================== */
const yoke = {
  active:false,
  lastX:0, lastY:0,
  pitchCmd:0, rollCmd:0, // -1..+1
};

function setYokeFromDrag(dx, dy){
  // dx -> roll, dy -> pitch
  yoke.rollCmd  = clamp(yoke.rollCmd  + dx * 0.003, -1, 1);
  yoke.pitchCmd = clamp(yoke.pitchCmd - dy * 0.003, -1, 1);
}

function yokeCenter(){
  yoke.rollCmd = 0;
  yoke.pitchCmd = 0;
}

function pointerPos(ev){
  const r = renderer.domElement.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

// Use the WebGL canvas as interaction surface
renderer.domElement.style.touchAction = "none";

renderer.domElement.addEventListener("pointerdown", (ev) => {
  // ignore if clicking on control panel
  const path = ev.composedPath?.() || [];
  if (path.includes(ctrlEl)) return;

  yoke.active = true;
  const p = pointerPos(ev);
  yoke.lastX = p.x; yoke.lastY = p.y;
  renderer.domElement.setPointerCapture(ev.pointerId);
});

renderer.domElement.addEventListener("pointermove", (ev) => {
  if (!yoke.active) return;
  const p = pointerPos(ev);
  const dx = p.x - yoke.lastX;
  const dy = p.y - yoke.lastY;
  yoke.lastX = p.x; yoke.lastY = p.y;
  setYokeFromDrag(dx, dy);
});

renderer.domElement.addEventListener("pointerup", (ev) => {
  yoke.active = false;
});

renderer.domElement.addEventListener("dblclick", () => yokeCenter());

/* Apply yoke commands each frame (when AP off) */
function applyYoke(dt){
  if (sim.apOn) return; // AP owns pitch/roll
  // rate-limited like a spring
  const pitchRate = sim.pitchRate * 0.85;
  const rollRate  = sim.rollRate  * 0.85;

  sim.pitch += yoke.pitchCmd * pitchRate * dt;
  sim.roll  += yoke.rollCmd  * rollRate  * dt;

  sim.pitch = clamp(sim.pitch, rad(-15), rad(20));
  sim.roll  = clamp(sim.roll,  rad(-45), rad(45));
}
 
/* ===========================
   MAIN LOOP
=========================== */
let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = clamp((now - last) / 1000, 0, 0.033);
  last = now;

  if (!sim.paused){
    // A/THR first (it moves throttle demand)
    athr.update(dt);

    // AP next (it moves pitch/roll)
    ap.update(dt);

    // update FMA strings (post mode logic)
    updateFMA();

    // virtual yardstick
    applyYoke(dt);

    // physics integration
    stepPhysics(dt);

    // trainer checks/scoring
    trainer.tick(dt);

    // callout decay
    if (sim.calloutTimer > 0) sim.calloutTimer -= dt;
  }

  // update aircraft pose
  aircraft.position.copy(sim.pos);
  aircraft.rotation.set(sim.pitch, sim.yaw, sim.roll, "XYZ");

  // chase camera
  const back = new THREE.Vector3(-85, 28, 26);
  back.applyAxisAngle(new THREE.Vector3(0,1,0), sim.yaw);
  const camPos = sim.pos.clone().add(back);
  camera.position.lerp(camPos, 0.10);
  camera.lookAt(sim.pos.x + 40, sim.pos.y + 10, sim.pos.z);

  drawHUD();
  updatePanel();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

</script>
</body>
</html>
